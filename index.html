<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>লুডু পয়েন্ট গেম</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:linear-gradient(135deg,#eef2ff,#f5f3ff);
color:#172033;
min-height:100vh;
}

.container{
width:100%;
max-width:900px;
margin:auto;
padding:15px;
}

header{
background:linear-gradient(135deg,#4338ca,#7c3aed);
color:#fff;
padding:25px 18px;
border-radius:20px;
text-align:center;
margin-bottom:18px;
box-shadow:0 10px 30px rgba(67,56,202,.25);
}

header h1{
font-size:28px;
margin-bottom:8px;
}

.card{
background:#fff;
padding:20px;
border-radius:18px;
margin-bottom:16px;
box-shadow:0 6px 25px rgba(0,0,0,.08);
}

.card h2{
margin-bottom:15px;
}

.auth-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

input{
width:100%;
padding:13px;
margin:6px 0;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
outline:none;
}

input:focus{
border-color:#4f46e5;
}

button{
border:0;
background:#4f46e5;
color:#fff;
padding:12px 16px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin:5px;
font-size:15px;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.hidden{
display:none!important;
}

.topbar{
background:#fff;
padding:15px;
border-radius:15px;
margin-bottom:16px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.user-info{
display:flex;
flex-direction:column;
gap:4px;
}

.point-box{
background:#ecfdf5;
color:#047857;
padding:10px 15px;
border-radius:12px;
font-weight:bold;
}

.logout{
background:#dc2626;
}

.game{
text-align:center;
}

.dice-area{
display:flex;
justify-content:center;
gap:20px;
margin:20px 0;
}

.dice{
width:90px;
height:90px;
display:flex;
align-items:center;
justify-content:center;
border-radius:18px;
border:3px solid #4f46e5;
background:#f8fafc;
font-size:42px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.options{
display:flex;
justify-content:center;
flex-wrap:wrap;
margin:15px 0;
}

.option{
background:#64748b;
}

.option.active{
background:#059669;
}

.play{
width:90%;
max-width:400px;
background:#059669;
font-size:18px;
padding:14px;
}

.selected-box{
background:#f3f4f6;
padding:12px;
border-radius:10px;
margin:12px 0;
}

.result{
min-height:30px;
margin-top:15px;
font-size:19px;
font-weight:bold;
}

.win{
color:#059669;
}

.lose{
color:#dc2626;
}

.info{
background:#eff6ff;
padding:12px;
border-radius:10px;
margin-top:15px;
color:#1e40af;
font-size:14px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.stat{
background:#f8fafc;
padding:12px;
border-radius:10px;
text-align:center;
border:1px solid #e5e7eb;
}

.history{
max-height:400px;
overflow-y:auto;
}

.history-item{
background:#f8fafc;
padding:12px;
border-radius:10px;
margin-bottom:8px;
border-left:4px solid #4f46e5;
}

.empty{
text-align:center;
padding:20px;
color:#6b7280;
}

.status{
padding:10px;
border-radius:10px;
margin-bottom:12px;
display:none;
}

.status.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.status.success{
display:block;
background:#dcfce7;
color:#166534;
}

@media(max-width:650px){

.auth-grid{
grid-template-columns:1fr;
}

.topbar{
flex-direction:column;
align-items:stretch;
text-align:center;
}

.stats-grid{
grid-template-columns:repeat(2,1fr);
}

header h1{
font-size:23px;
}

.dice{
width:75px;
height:75px;
font-size:34px;
}

.play{
width:100%;
}

}
</style>
</head>

<body>

<div class="container">

<header>
<h1>🎲 লুডু পয়েন্ট গেম</h1>
<p>ফ্রি Virtual Points Game</p>
</header>

<div id="status" class="status"></div>

<section id="authSection">

<div class="auth-grid">

<div class="card">

<h2>📝 রেজিস্ট্রেশন</h2>

<input
id="regName"
type="text"
placeholder="আপনার নাম"
>

<input
id="regEmail"
type="email"
placeholder="ইমেইল"
>

<input
id="regPassword"
type="password"
placeholder="পাসওয়ার্ড"
>

<button onclick="registerUser()">
অ্যাকাউন্ট তৈরি করুন
</button>

</div>

<div class="card">

<h2>🔐 লগইন</h2>

<input
id="loginEmail"
type="email"
placeholder="ইমেইল"
>

<input
id="loginPassword"
type="password"
placeholder="পাসওয়ার্ড"
>

<button onclick="loginUser()">
লগইন
</button>

</div>

</div>

</section>

<section id="appSection" class="hidden">

<div class="topbar">

<div class="user-info">

<span>
👤 <b id="userName">User</b>
</span>

<span id="userEmail"></span>

</div>

<div class="point-box">

⭐ পয়েন্ট:
<span id="userPoints">0</span>

</div>

<button
class="logout"
onclick="logoutUser()"
>
Logout
</button>

</div>

<div class="card game">

<h2>🎲 ডাইস গেম</h2>

<p>
দুটি ডাইস চালিয়ে মোট সংখ্যা নির্ধারণ হবে।
</p>

<div class="dice-area">

<div
id="dice1"
class="dice"
>
?
</div>

<div
id="dice2"
class="dice"
>
?
</div>

</div>

<div class="selected-box">

নির্বাচিত অপশন:

<b id="selectedOption">
কিছুই নির্বাচন করা হয়নি
</b>

</div>

<div class="options">

<button
id="optionLE7"
class="option"
onclick="selectOption('LE7')"
>
৭ বা কম
</button>

<button
id="optionGT7"
class="option"
onclick="selectOption('GT7')"
>
৭-এর বেশি
</button>

<button
id="optionEVEN"
class="option"
onclick="selectOption('EVEN')"
>
জোড় সংখ্যা
</button>

</div>

<button
id="playButton"
class="play"
onclick="playGame()"
>
🎯 ডাইস চালান
</button>

<div
id="result"
class="result"
></div>

<div class="info">
জয় হলে +১০ Virtual Points এবং হারলে ৫ Virtual Points কমবে।
</div>

</div>

<div class="card">

<h2>📊 ডাইস পরিসংখ্যান</h2>

<div
id="stats"
class="stats-grid"
>
</div>

</div>

<div class="card">

<h2>📜 আমার গেম ইতিহাস</h2>

<div
id="history"
class="history"
>
</div>

</div>

</section>

</div>

<script>

const SUPABASE_URL =
"https://mulroqtysdawwdrpdxtx.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11bHJvcXR5c2Rhd3d2ZHJwZHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTI4NDEsImV4cCI6MjEwNDE4ODg0MX0.4IyzSSPea7-zJcenzeqo43gN7XCeEqFvBnOptz25Zx0";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let currentUser = null;
let currentProfile = null;
let selectedOption = null;


function message(text,type="error"){

const box =
document.getElementById("status");

box.textContent = text;

box.className =
"status " + type;

setTimeout(()=>{

box.className="status";

},5000);

}


function showAuth(){

document
.getElementById("authSection")
.classList.remove("hidden");

document
.getElementById("appSection")
.classList.add("hidden");

}


function showApp(){

document
.getElementById("authSection")
.classList.add("hidden");

document
.getElementById("appSection")
.classList.remove("hidden");

}


async function registerUser(){

const name =
document
.getElementById("regName")
.value
.trim();

const email =
document
.getElementById("regEmail")
.value
.trim();

const password =
document
.getElementById("regPassword")
.value;

if(!name){

message("আপনার নাম দিন");

return;

}

if(!email){

message("ইমেইল দিন");

return;

}

if(password.length < 6){

message(
"পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে"
);

return;

}

const {
data,
error
} =
await db.auth.signUp({

email:email,

password:password,

options:{
data:{
name:name
}
}

});

if(error){

message(error.message);

return;

}

if(data.session){

message(
"রেজিস্ট্রেশন সফল হয়েছে।",
"success"
);

}else{

message(
"রেজিস্ট্রেশন সফল। ইমেইল verification প্রয়োজন হলে ইমেইল যাচাই করুন।",
"success"
);

}

}


async function loginUser(){

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

if(!email || !password){

message(
"ইমেইল এবং পাসওয়ার্ড দিন"
);

return;

}

const {
data,
error
} =
await db.auth.signInWithPassword({

email:email,

password:password

});

if(error){

message(error.message);

return;

}

currentUser =
data.user;

await loadProfile();

}


async function loadProfile(){

const {
data,
error
} =
await db
.from("profiles")
.select("*")
.eq(
"id",
currentUser.id
)
.single();

if(error){

message(
"Profile পাওয়া যায়নি: " +
error.message
);

return;

}

currentProfile =
data;

document
.getElementById("userName")
.textContent =
data.name;

document
.getElementById("userEmail")
.textContent =
data.email ||
currentUser.email;

updatePoints();

showApp();

await loadStats();

await loadHistory();

}


function updatePoints(){

document
.getElementById("userPoints")
.textContent =
Number(currentProfile.points || 0);

}


function selectOption(option){

selectedOption =
option;

document
.querySelectorAll(".option")
.forEach(button=>{
button.classList.remove("active");
});

let id;

if(option === "LE7"){
id="optionLE7";
}

if(option === "GT7"){
id="optionGT7";
}

if(option === "EVEN"){
id="optionEVEN";
}

document
.getElementById(id)
.classList.add("active");

const names={

LE7:"৭ বা কম",

GT7:"৭-এর বেশি",

EVEN:"জোড় সংখ্যা"

};

document
.getElementById("selectedOption")
.textContent =
names[option];

}


function randomDice(){

return Math.floor(
Math.random()*6
)+1;

}


async function playGame(){

if(!currentUser){

message("আগে লগইন করুন");

return;

}

if(!selectedOption){

message(
"প্রথমে একটি অপশন নির্বাচন করুন"
);

return;

}

const button =
document
.getElementById("playButton");

button.disabled=true;

document
.getElementById("result")
.className="result";

document
.getElementById("result")
.textContent="🎲 ডাইস চলছে...";

const dice1 =
randomDice();

const dice2 =
randomDice();

const total =
dice1+dice2;

document
.getElementById("dice1")
.textContent=dice1;

document
.getElementById("dice2")
.textContent=dice2;

let win=false;

if(
selectedOption === "LE7"
){
win =
total <= 7;
}

if(
selectedOption === "GT7"
){
win =
total > 7;
}

if(
selectedOption === "EVEN"
){
win =
total % 2 === 0;
}

const pointsChange =
win ? 10 : -5;

const oldPoints =
Number(
currentProfile.points || 0
);

const newPoints =
Math.max(
0,
oldPoints + pointsChange
);

const {
error:updateError
} =
await db
.from("profiles")
.update({
points:newPoints
})
.eq(
"id",
currentUser.id
);

if(updateError){

message(
"পয়েন্ট আপডেট হয়নি: " +
updateError.message
);

button.disabled=false;

return;

}

const {
error:gameError
} =
await db
.from("games")
.insert({

user_id:
currentUser.id,

dice_1:
dice1,

dice_2:
dice2,

total:
total,

selected_option:
selectedOption,

result:
win
?"win"
:"loss",

points_change:
pointsChange

});

if(gameError){

await db
.from("profiles")
.update({
points:oldPoints
})
.eq(
"id",
currentUser.id
);

message(
"গেম সংরক্ষণ হয়নি: " +
gameError.message
);

button.disabled=false;

return;

}

await db
.from("point_history")
.insert({

user_id:
currentUser.id,

points:
pointsChange,

type:
win
?"game_win"
:"game_loss",

description:
`Dice ${dice1}+${dice2} = ${total}`

});

currentProfile.points =
newPoints;

updatePoints();

const result =
document
.getElementById("result");

if(win){

result.className =
"result win";

result.textContent =
`🎉 আপনি জয়ী! +${pointsChange} পয়েন্ট`;

}else{

result.className =
"result lose";

result.textContent =
`😔 আপনি হেরেছেন। ${pointsChange} পয়েন্ট`;

}

await loadStats();

await loadHistory();

button.disabled=false;

}


async function loadStats(){

const stats =
document
.getElementById("stats");

const {
data,
error
} =
await db
.from("dice_statistics_view")
.select("*")
.order(
"total",
{
ascending:true
}
);

if(error){

stats.innerHTML =
`
<div class="empty">
পরিসংখ্যান পাওয়া যাচ্ছে না
</div>
`;

return;

}

const totals={};

for(
let i=2;
i<=12;
i++
){

totals[i]=0;

}

(data || []).forEach(item=>{

totals[item.total] =
Number(item.count);

});

stats.innerHTML =
Object
.keys(totals)
.map(total=>{

return `
<div class="stat">

<div>🎲 ${total}</div>

<strong>
${totals[total]} বার
</strong>

</div>
`;

})
.join("");

}


async function loadHistory(){

const history =
document
.getElementById("history");

const {
data,
error
} =
await db
.from("games")
.select("*")
.eq(
"user_id",
currentUser.id
)
.order(
"created_at",
{
ascending:false
}
)
.limit(50);

if(error){

history.innerHTML =
`
<div class="empty">
History পাওয়া যাচ্ছে না
</div>
`;

return;

}

if(!data || data.length===0){

history.innerHTML =
`
<div class="empty">
এখনো কোনো গেম খেলা হয়নি
</div>
`;

return;

}

history.innerHTML =
data
.map(game=>{

const date =
new Date(
game.created_at
).toLocaleString(
"bn-BD"
);

const status =
game.result === "win"
?"🎉 জয়"
:"😔 হার";

const change =
game.points_change > 0
? "+" + game.points_change
: game.points_change;

return `
<div class="history-item">

<b>${status}</b>

<br>

🎲
${game.dice_1}
+
${game.dice_2}
=
${game.total}

<br>

⭐
পয়েন্ট:
${change}

<br>

<small>
${date}
</small>

</div>
`;

})
.join("");

}


async function logoutUser(){

await db.auth.signOut();

currentUser=null;

currentProfile=null;

selectedOption=null;

showAuth();

}


async function checkSession(){

const {
data
} =
await db.auth.getSession();

if(
data &&
data.session &&
data.session.user
){

currentUser =
data.session.user;

await loadProfile();

}else{

showAuth();

}

}


db.auth.onAuthStateChange(
(event,session)=>{

if(
event === "SIGNED_OUT"
){

currentUser=null;

currentProfile=null;

showAuth();

}

}
);


checkSession();

</script>

</body>
</html>
