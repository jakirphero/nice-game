<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nice Game - Dice Game</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    font-size:34px;
    margin-bottom:8px;
}

.header p{
    color:#cbd5e1;
}

.card{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    backdrop-filter:blur(12px);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.login-box{
    max-width:500px;
    margin:60px auto;
    text-align:center;
}

.login-box h2{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

button{
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.primary{
    background:#22c55e;
    color:white;
}

.blue{
    background:#3b82f6;
    color:white;
}

.orange{
    background:#f59e0b;
    color:#111;
}

.red{
    background:#ef4444;
    color:white;
}

.full{
    width:100%;
}

.hidden{
    display:none !important;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.player-name{
    font-size:21px;
    font-weight:bold;
}

.points{
    background:#f59e0b;
    color:#111827;
    padding:10px 18px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
}

.game-area{
    text-align:center;
}

.dice-container{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:25px 0;
}

.dice{
    width:100px;
    height:100px;
    background:white;
    color:#111;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    box-shadow:0 12px 30px rgba(0,0,0,.3);
}

.total{
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.option{
    min-height:75px;
    background:#6366f1;
    color:white;
}

.option small{
    display:block;
    margin-top:5px;
    opacity:.8;
}

.message{
    padding:14px;
    margin-top:18px;
    border-radius:12px;
    font-weight:bold;
}

.success{
    background:rgba(34,197,94,.2);
    border:1px solid #22c55e;
}

.error{
    background:rgba(239,68,68,.2);
    border:1px solid #ef4444;
}

.info{
    background:rgba(59,130,246,.2);
    border:1px solid #3b82f6;
}

.section-title{
    margin-bottom:15px;
    font-size:22px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
}

.stat{
    padding:13px;
    text-align:center;
    background:rgba(255,255,255,.07);
    border-radius:12px;
}

.stat strong{
    display:block;
    font-size:22px;
    margin-top:5px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.1);
}

th{
    background:rgba(255,255,255,.08);
}

.win{
    color:#4ade80;
    font-weight:bold;
}

.loss{
    color:#f87171;
    font-weight:bold;
}

.admin-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.player-list{
    max-height:450px;
    overflow:auto;
}

.player-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.player-buttons{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.player-buttons button{
    padding:8px 10px;
}

.loading{
    text-align:center;
    padding:20px;
    color:#cbd5e1;
}

.footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .admin-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .header h1{
        font-size:27px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .dice{
        width:80px;
        height:80px;
        font-size:45px;
    }

    .topbar{
        flex-direction:column;
        align-items:stretch;
    }

    .points{
        text-align:center;
    }

    .player-buttons{
        justify-content:flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>🎲 Nice Game</h1>
    <p>Virtual Points Dice Game</p>
</div>


<!-- LOGIN / PLAYER NAME -->

<div id="loginSection" class="card login-box">

    <h2>🎮 Game শুরু করুন</h2>

    <p style="color:#cbd5e1;margin:10px 0;">
        আপনার নাম লিখুন
    </p>

    <input
        id="playerName"
        type="text"
        maxlength="50"
        placeholder="আপনার নাম"
    >

    <button
        class="primary full"
        onclick="startGame()"
    >
        🚀 গেম শুরু করুন
    </button>

    <div id="loginMessage"></div>

</div>


<!-- MAIN GAME -->

<div id="gameSection" class="hidden">


<!-- PLAYER BAR -->

<div class="card">

    <div class="topbar">

        <div class="player-name">
            👤 <span id="currentPlayerName"></span>
        </div>

        <div class="points">
            💰 <span id="currentPoints">0</span> Points
        </div>

        <button
            class="red"
            onclick="logoutPlayer()"
        >
            বের হন
        </button>

    </div>

</div>


<!-- DICE GAME -->

<div class="card game-area">

    <h2 class="section-title">
        🎲 Dice Game
    </h2>

    <p style="color:#cbd5e1;">
        একটি অপশন নির্বাচন করুন
    </p>

    <div class="dice-container">

        <div id="dice1" class="dice">
            🎲
        </div>

        <div id="dice2" class="dice">
            🎲
        </div>

    </div>

    <div class="total">
        Total:
        <span id="diceTotal">-</span>
    </div>


    <div class="options">

        <button
            id="btnLE7"
            class="option"
            onclick="playGame('LE7')"
        >
            ৭ বা তার কম
            <small>জিতলে +10 | হারলে -5</small>
        </button>


        <button
            id="btnGT7"
            class="option"
            onclick="playGame('GT7')"
        >
            ৭ এর বেশি
            <small>জিতলে +10 | হারলে -5</small>
        </button>


        <button
            id="btnEVEN"
            class="option"
            onclick="playGame('EVEN')"
        >
            জোড় সংখ্যা
            <small>জিতলে +10 | হারলে -5</small>
        </button>

    </div>

    <div id="gameMessage"></div>

</div>


<!-- STATISTICS -->

<div class="card">

    <h2 class="section-title">
        📊 Dice Statistics
    </h2>

    <div id="statistics" class="stats"></div>

</div>


<!-- HISTORY -->

<div class="card">

    <h2 class="section-title">
        📜 আপনার Game History
    </h2>

    <div id="history">

        <div class="loading">
            Loading...
        </div>

    </div>

</div>


<!-- ADMIN -->

<div id="adminSection" class="hidden">

<div class="card">

    <h2 class="section-title">
        👑 Admin Panel
    </h2>


    <div class="admin-grid">


        <!-- CREATE PLAYER -->

        <div>

            <h3>
                ➕ নতুন Player তৈরি করুন
            </h3>

            <input
                id="newPlayerName"
                type="text"
                placeholder="Player-এর নাম"
            >

            <input
                id="newPlayerPoints"
                type="number"
                min="0"
                value="100"
                placeholder="Starting Points"
            >

            <button
                class="primary full"
                onclick="createPlayer()"
            >
                Player তৈরি করুন
            </button>

        </div>


        <!-- PLAYER LIST -->

        <div>

            <h3 style="margin-bottom:10px;">
                👥 সব Player
            </h3>

            <div
                id="adminPlayers"
                class="player-list"
            >
                <div class="loading">
                    Loading...
                </div>
            </div>

        </div>

    </div>

</div>

</div>

</div>


<div class="footer">
    Nice Game © 2026 — Virtual Points Only
</div>

</div>


<script>

/* ========================================
   SUPABASE CONFIG
======================================== */

const SUPABASE_URL =
"https://mulroqtysdawwvdrpdxtx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-v7fU5dwzz0LddbM-f87PQ_-L1BH-bl";

const ADMIN_ID =
"95b9a85a-c30b-4111-b688-20abde0d3236";


const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ========================================
   GLOBAL
======================================== */

let currentPlayer = null;
let isPlaying = false;


/* ========================================
   HTML ESCAPE
======================================== */

function escapeHTML(value){

    const div =
    document.createElement("div");

    div.textContent =
    value ?? "";

    return div.innerHTML;
}


/* ========================================
   MESSAGE
======================================== */

function showMessage(
    id,
    text,
    type
){

    const el =
    document.getElementById(id);

    el.className =
    "message " + type;

    el.innerHTML =
    text;
}


function clearMessage(id){

    const el =
    document.getElementById(id);

    el.className = "";

    el.innerHTML = "";
}


/* ========================================
   START GAME
======================================== */

async function startGame(){

    if(isPlaying) return;

    const input =
    document.getElementById("playerName");

    const name =
    input.value.trim();


    if(!name){

        showMessage(
            "loginMessage",
            "⚠️ আপনার নাম লিখুন।",
            "error"
        );

        return;
    }


    if(name.length < 2){

        showMessage(
            "loginMessage",
            "⚠️ নাম কমপক্ষে ২ অক্ষরের হতে হবে।",
            "error"
        );

        return;
    }


    isPlaying = true;


    showMessage(
        "loginMessage",
        "⏳ Player খোঁজা হচ্ছে...",
        "info"
    );


    try{

        const {
            data:existingPlayer,
            error:selectError
        } = await db
        .from("players")
        .select("*")
        .eq("name",name)
        .maybeSingle();


        if(selectError){

            throw selectError;

        }


        if(existingPlayer){

            currentPlayer =
            existingPlayer;

        }else{

            const {
                data:newPlayer,
                error:insertError
            } = await db
            .from("players")
            .insert({
                name:name,
                points:100
            })
            .select()
            .single();


            if(insertError){

                if(insertError.code === "23505"){

                    const {
                        data:retryPlayer,
                        error:retryError
                    } = await db
                    .from("players")
                    .select("*")
                    .eq("name",name)
                    .single();


                    if(retryError){

                        throw retryError;

                    }


                    currentPlayer =
                    retryPlayer;

                }else{

                    throw insertError;

                }

            }else{

                currentPlayer =
                newPlayer;


                await db
                .from("point_history")
                .insert({

                    player_id:
                    newPlayer.id,

                    points:
                    newPlayer.points,

                    type:
                    "INITIAL",

                    description:
                    "নতুন Player হিসেবে Points দেওয়া হয়েছে"

                });

            }

        }


        document
        .getElementById("loginSection")
        .classList
        .add("hidden");


        document
        .getElementById("gameSection")
        .classList
        .remove("hidden");


        document
        .getElementById("currentPlayerName")
        .textContent =
        currentPlayer.name;


        updatePoints();


        if(
            currentPlayer.id === ADMIN_ID
        ){

            document
            .getElementById("adminSection")
            .classList
            .remove("hidden");

            await loadAdminPlayers();

        }


        await loadHistory();

        await loadStatistics();


        clearMessage("loginMessage");


    }catch(error){

        console.error(error);

        showMessage(
            "loginMessage",
            "❌ Database Error: " +
            escapeHTML(error.message),
            "error"
        );

    }finally{

        isPlaying = false;

    }

}


/* ========================================
   POINTS UI
======================================== */

function updatePoints(){

    if(!currentPlayer) return;

    document
    .getElementById("currentPoints")
    .textContent =
    currentPlayer.points;

}


/* ========================================
   DICE
======================================== */

function rollDice(){

    const dice1 =
    Math.floor(Math.random()*6)+1;

    const dice2 =
    Math.floor(Math.random()*6)+1;


    return {

        dice1:dice1,

        dice2:dice2,

        total:
        dice1+dice2

    };

}


function diceEmoji(number){

    const emoji = {

        1:"⚀",
        2:"⚁",
        3:"⚂",
        4:"⚃",
        5:"⚄",
        6:"⚅"

    };

    return emoji[number];

}


/* ========================================
   PLAY
======================================== */

async function playGame(option){

    if(!currentPlayer) return;

    if(isPlaying) return;


    if(currentPlayer.points <= 0){

        showMessage(
            "gameMessage",
            "❌ আপনার Points শেষ।",
            "error"
        );

        return;
    }


    isPlaying = true;

    disableGameButtons(true);


    try{

        const dice =
        rollDice();


        document
        .getElementById("dice1")
        .textContent =
        diceEmoji(dice.dice1);


        document
        .getElementById("dice2")
        .textContent =
        diceEmoji(dice.dice2);


        document
        .getElementById("diceTotal")
        .textContent =
        dice.total;


        let win = false;


        if(option === "LE7"){

            win =
            dice.total <= 7;

        }


        if(option === "GT7"){

            win =
            dice.total > 7;

        }


        if(option === "EVEN"){

            win =
            dice.total % 2 === 0;

        }


        const change =
        win ? 10 : -5;


        const oldPoints =
        currentPlayer.points;


        const newPoints =
        Math.max(
            0,
            oldPoints + change
        );


        /*
          UPDATE PLAYER POINTS
        */

        const {
            data:updatedPlayer,
            error:updateError
        } = await db
        .from("players")
        .update({
            points:newPoints
        })
        .eq(
            "id",
            currentPlayer.id
        )
        .select()
        .single();


        if(updateError){

            throw updateError;

        }


        /*
          GAME RECORD
        */

        const {
            error:gameError
        } = await db
        .from("games")
        .insert({

            player_id:
            currentPlayer.id,

            dice_1:
            dice.dice1,

            dice_2:
            dice.dice2,

            total:
            dice.total,

            selected_option:
            option,

            result:
            win
            ? "WIN"
            : "LOSS",

            points_change:
            change

        });


        if(gameError){

            throw gameError;

        }


        /*
          POINT HISTORY
        */

        const {
            error:historyError
        } = await db
        .from("point_history")
        .insert({

            player_id:
            currentPlayer.id,

            points:
            newPoints,

            type:
            win
            ? "WIN"
            : "LOSS",

            description:
            `${getOptionText(option)} | ${dice.dice1}+${dice.dice2}=${dice.total} | ${change > 0 ? "+" : ""}${change} Points`

        });


        if(historyError){

            throw historyError;

        }


        currentPlayer =
        updatedPlayer;


        updatePoints();


        if(win){

            showMessage(
                "gameMessage",
                `🎉 অভিনন্দন! আপনি জিতেছেন। +${change} Points`,
                "success"
            );

        }else{

            showMessage(
                "gameMessage",
                `😔 আপনি হেরেছেন। ${change} Points`,
                "error"
            );

        }


        await loadHistory();

        await loadStatistics();


    }catch(error){

        console.error(error);

        showMessage(
            "gameMessage",
            "❌ Game Error: " +
            escapeHTML(error.message),
            "error"
        );

    }finally{

        disableGameButtons(false);

        isPlaying = false;

    }

}


/* ========================================
   OPTION TEXT
======================================== */

function getOptionText(option){

    if(option === "LE7")
        return "৭ বা তার কম";

    if(option === "GT7")
        return "৭ এর বেশি";

    if(option === "EVEN")
        return "জোড় সংখ্যা";

    return option;

}


/* ========================================
   DISABLE BUTTONS
======================================== */

function disableGameButtons(disabled){

    document
    .getElementById("btnLE7")
    .disabled =
    disabled;


    document
    .getElementById("btnGT7")
    .disabled =
    disabled;


    document
    .getElementById("btnEVEN")
    .disabled =
    disabled;

}


/* ========================================
   HISTORY
======================================== */

async function loadHistory(){

    if(!currentPlayer) return;


    const {
        data,
        error
    } = await db
    .from("games")
    .select("*")
    .eq(
        "player_id",
        currentPlayer.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    )
    .limit(50);


    if(error){

        console.error(error);

        document
        .getElementById("history")
        .innerHTML =
        `<div class="message error">
            ❌ History load হয়নি
        </div>`;

        return;

    }


    if(!data || data.length === 0){

        document
        .getElementById("history")
        .innerHTML =
        `<div class="loading">
            এখনো কোনো Game খেলা হয়নি।
        </div>`;

        return;

    }


    let html = `

    <div class="table-wrap">

    <table>

    <thead>

    <tr>

        <th>সময়</th>
        <th>Dice</th>
        <th>Total</th>
        <th>Option</th>
        <th>Result</th>
        <th>Points</th>

    </tr>

    </thead>

    <tbody>

    `;


    data.forEach(game => {

        const win =
        game.result === "WIN";


        html += `

        <tr>

            <td>
                ${escapeHTML(
                    new Date(
                        game.created_at
                    ).toLocaleString("bn-BD")
                )}
            </td>

            <td>
                ${game.dice_1} + ${game.dice_2}
            </td>

            <td>
                <strong>
                    ${game.total}
                </strong>
            </td>

            <td>
                ${escapeHTML(
                    getOptionText(
                        game.selected_option
                    )
                )}
            </td>

            <td class="${win ? "win" : "loss"}">
                ${win ? "জয়" : "হার"}
            </td>

            <td class="${win ? "win" : "loss"}">
                ${game.points_change > 0 ? "+" : ""}
                ${game.points_change}
            </td>

        </tr>

        `;

    });


    html += `

    </tbody>

    </table>

    </div>

    `;


    document
    .getElementById("history")
    .innerHTML =
    html;

}


/* ========================================
   STATISTICS
======================================== */

async function loadStatistics(){

    const {
        data,
        error
    } = await db
    .from("games")
    .select("total");


    if(error){

        console.error(error);

        return;

    }


    const counts = {};


    for(
        let i=2;
        i<=12;
        i++
    ){

        counts[i] = 0;

    }


    data.forEach(game => {

        if(
            counts[game.total] !== undefined
        ){

            counts[game.total]++;

        }

    });


    let html = "";


    for(
        let i=2;
        i<=12;
        i++
    ){

        html += `

        <div class="stat">

            🎲 ${i}

            <strong>
                ${counts[i]}
            </strong>

        </div>

        `;

    }


    document
    .getElementById("statistics")
    .innerHTML =
    html;

}


/* ========================================
   ADMIN PLAYERS
======================================== */

async function loadAdminPlayers(){

    if(
        !currentPlayer ||
        currentPlayer.id !== ADMIN_ID
    ){

        return;

    }


    const {
        data,
        error
    } = await db
    .from("players")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);

        document
        .getElementById("adminPlayers")
        .innerHTML =
        `<div class="message error">
            ❌ Player list load হয়নি
        </div>`;

        return;

    }


    let html = "";


    data.forEach(player => {

        html += `

        <div class="player-item">

            <div>

                <strong>
                    ${escapeHTML(player.name)}
                </strong>

                <div style="color:#cbd5e1;">
                    ${player.points} Points
                </div>

            </div>

            <div class="player-buttons">

                <button
                    class="blue"
                    onclick="addPoints('${player.id}',50)"
                >
                    +50
                </button>

                <button
                    class="orange"
                    onclick="addPoints('${player.id}',100)"
                >
                    +100
                </button>

                <button
                    class="primary"
                    onclick="addPoints('${player.id}',500)"
                >
                    +500
                </button>

            </div>

        </div>

        `;

    });


    document
    .getElementById("adminPlayers")
    .innerHTML =
    html;

}


/* ========================================
   CREATE PLAYER
======================================== */

async function createPlayer(){

    if(
        !currentPlayer ||
        currentPlayer.id !== ADMIN_ID
    ){

        alert(
            "❌ Admin permission নেই।"
        );

        return;

    }


    const name =
    document
    .getElementById("newPlayerName")
    .value
    .trim();


    const points =
    Number(
        document
        .getElementById("newPlayerPoints")
        .value
    );


    if(!name){

        alert(
            "Player-এর নাম লিখুন।"
        );

        return;

    }


    if(
        Number.isNaN(points) ||
        points < 0
    ){

        alert(
            "সঠিক Points দিন।"
        );

        return;

    }


    try{

        const {
            data,
            error
        } = await db
        .from("players")
        .insert({

            name:name,

            points:points

        })
        .select()
        .single();


        if(error){

            throw error;

        }


        await db
        .from("point_history")
        .insert({

            player_id:
            data.id,

            points:
            points,

            type:
            "ADMIN_CREATE",

            description:
            `Admin Player তৈরি করেছেন (${points} Points)`

        });


        document
        .getElementById("newPlayerName")
        .value = "";


        document
        .getElementById("newPlayerPoints")
        .value = "100";


        alert(
            "✅ Player তৈরি হয়েছে।"
        );


        await loadAdminPlayers();


    }catch(error){

        console.error(error);

        alert(
            "❌ Player তৈরি হয়নি: " +
            error.message
        );

    }

}


/* ========================================
   ADD POINTS
======================================== */

async function addPoints(
    playerId,
    amount
){

    if(
        !currentPlayer ||
        currentPlayer.id !== ADMIN_ID
    ){

        alert(
            "❌ Admin permission প্রয়োজন।"
        );

        return;

    }


    try{

        const {
            data:player,
            error:selectError
        } = await db
        .from("players")
        .select("*")
        .eq(
            "id",
            playerId
        )
        .single();


        if(selectError){

            throw selectError;

        }


        const newPoints =
        player.points + amount;


        const {
            error:updateError
        } = await db
        .from("players")
        .update({

            points:newPoints

        })
        .eq(
            "id",
            playerId
        );


        if(updateError){

            throw updateError;

        }


        await db
        .from("point_history")
        .insert({

            player_id:
            playerId,

            points:
            newPoints,

            type:
            "ADMIN_ADD",

            description:
            `Admin +${amount} Points যোগ করেছেন`

        });


        alert(
            `✅ ${amount} Points যোগ হয়েছে।`
        );


        if(
            playerId === currentPlayer.id
        ){

            currentPlayer.points =
            newPoints;

            updatePoints();

        }


        await loadAdminPlayers();


    }catch(error){

        console.error(error);

        alert(
            "❌ Points যোগ করা যায়নি: " +
            error.message
        );

    }

}
